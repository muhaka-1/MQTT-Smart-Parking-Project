# Mosquitto for the Smart Parking system (local network use).
listener 1883
allow_anonymous true
persistence true
persistence_location /mosquitto/data/

# To require a password instead:
#   docker compose exec mosquitto mosquitto_passwd -c /mosquitto/config/passwd parking
#   then set:  allow_anonymous false
#              password_file /mosquitto/config/passwd
#   and put the same user/password in MQTT_URL (mqtt://parking:secret@mosquitto:1883)
#   and in mqttClient.connect(...) in src/main.cpp.
